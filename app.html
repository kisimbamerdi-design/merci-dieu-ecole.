<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d3b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png">
<title>Merci-Dieu Smart School</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#1f7a2e;--g2:#2e9a42;--gd:#0d3b2a;--gd2:#124d38;--gold:#f2b81c;--gold2:#c9971a;--red:#d0202a;--blue:#2457c5;
--ink:#1d2b26;--mut:#73837b;--line:#e4eae6;--bg:#f3f6f3;--card:#fff;--soft:#eef4ef}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14.5px}
h1,h2,h3,h4{font-family:Manrope,'DM Sans',sans-serif;margin:0;letter-spacing:-.4px}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
/* ----- menu latéral ----- */
.side{background:linear-gradient(180deg,var(--gd) 0%,#082a1f 100%);color:#d9e8df;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.side:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 40px,#ffffff05 40px 41px);pointer-events:none}
.brand{display:flex;gap:12px;align-items:center;padding:22px 20px 18px;position:relative}
.brand img{width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #f2b81c80,0 6px 16px #0006}
.brand b{display:block;font:800 15px Manrope;color:#fff;letter-spacing:.2px}
.brand small{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
.nav{flex:1;overflow:auto;padding:4px 12px 12px;position:relative}
.nav h6{margin:16px 10px 6px;font:700 10px 'DM Sans';letter-spacing:1.8px;text-transform:uppercase;color:#7da593}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:#cfe2d7;text-decoration:none;cursor:pointer;font-weight:500;margin-bottom:2px;transition:.12s}
.nav a i{font-style:normal;width:22px;text-align:center;font-size:15px;opacity:.9}
.nav a:hover{background:#ffffff12;color:#fff}
.nav a.on{background:linear-gradient(90deg,#f2b81c,#e5a50f);color:#0d3b2a;font-weight:700;box-shadow:0 6px 14px #0004}
.nav a .n{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.me{position:relative;padding:14px 16px;border-top:1px solid #ffffff14;display:flex;align-items:center;gap:11px}
.av{width:38px;height:38px;border-radius:50%;background:#f2b81c;color:#0d3b2a;display:grid;place-items:center;font:800 14px Manrope;flex:none}
.me b{display:block;color:#fff;font-size:13.5px;line-height:1.25}
.me small{color:#8fb3a1;font-size:11.5px}
.me button{margin-left:auto;background:#ffffff14;border:0;color:#d9e8df;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px}
.me button:hover{background:#ffffff26}
/* ----- zone principale ----- */
.main{min-width:0}
.top{display:none;position:sticky;top:0;z-index:20;background:var(--gd);color:#fff;padding:10px 14px;align-items:center;gap:12px}
.top button{background:#ffffff18;border:0;color:#fff;width:40px;height:40px;border-radius:11px;font-size:19px}
.top b{font:800 15px Manrope}
.content{padding:30px 34px 60px;max-width:1280px}
.ph{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.ph h2{font-size:27px}
.ph p{margin:6px 0 0;color:var(--mut)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 1px 2px #0d3b2a08,0 10px 28px -18px #0d3b2a30}
.card h3{font-size:16.5px;margin-bottom:14px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mt{margin-top:18px}
.hello{position:relative;overflow:hidden;border-radius:22px;padding:28px 30px;color:#fff;background:radial-gradient(900px 300px at 100% 0,#2e9a42 0%,transparent 60%),linear-gradient(120deg,#0d3b2a,#14573f);display:flex;align-items:center;gap:22px;margin-bottom:20px}
.hello img{width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #f2b81c90,0 12px 30px #0006;flex:none}
.hello h2{font-size:26px}
.hello p{margin:8px 0 0;color:#cfe5d8;max-width:560px;line-height:1.6}
.hello .dt{position:absolute;right:26px;top:20px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#f2d98a;font-weight:700}
.kpi{position:relative;overflow:hidden}
.kpi small{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.kpi b{display:block;font:800 30px Manrope;margin:8px 0 4px;letter-spacing:-1px}
.kpi span{color:var(--mut);font-size:12.5px}
.kpi:after{content:'';position:absolute;right:-18px;top:-18px;width:76px;height:76px;border-radius:50%;background:var(--soft)}
.kpi.gold:after{background:#fdf1cb}.kpi.red:after{background:#fbe3e4}.kpi.blue:after{background:#e3ebfb}
.kpi.red b{color:var(--red)}
.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:.12s;background:var(--soft);color:var(--gd)}
.btn:hover{filter:brightness(.96)}
.btn.pri{background:linear-gradient(90deg,var(--g),var(--g2));color:#fff;box-shadow:0 8px 18px #1f7a2e30}
.btn.gold{background:linear-gradient(90deg,#f2b81c,#e8a90f);color:#0d3b2a}
.btn.red{background:#fbe3e4;color:var(--red)}
.btn.line{background:#fff;border:1.5px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--gd2);white-space:nowrap}
.chip.ok{background:#e1f5e6;color:#17692a}.chip.warn{background:#fdf0cc;color:#8a6200}.chip.bad{background:#fbe3e4;color:#b01c25}.chip.info{background:#e3ebfb;color:#2048a6}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut);text-align:left;padding:12px 14px;background:#f8faf8;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:12px 14px;border-bottom:1px solid #eff3f0;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.cl{cursor:pointer}tbody tr.cl:hover td{background:#f6faf7}
td.r,th.r{text-align:right}
.empty{padding:34px;text-align:center;color:var(--mut)}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bar i{display:block;height:11px;border-radius:99px;background:linear-gradient(90deg,var(--g2),var(--g))}
.bar div{background:var(--soft);border-radius:99px;overflow:hidden}
.bar.gd i{background:linear-gradient(90deg,#f7cf5a,var(--gold2))}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select,.f input,.f select,.f textarea{border:1.5px solid var(--line);background:#fbfcfb;border-radius:11px;padding:10px 13px;outline:none;min-width:0}
.tools input{flex:1;min-width:200px}
.tools input:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--g2);box-shadow:0 0 0 4px #e1f3e6;background:#fff}
.f{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f label{display:block;font-size:12px;font-weight:700;color:#53696e;margin-bottom:6px}
.f .full{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs a{padding:9px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);cursor:pointer;font-weight:600;color:var(--mut)}
.tabs a.on{background:var(--gd);border-color:var(--gd);color:#fff}
.mask{position:fixed;inset:0;background:#0b1f17b3;backdrop-filter:blur(3px);display:grid;place-items:start center;z-index:60;padding:28px 16px;overflow:auto}
.dlg{background:#fff;border-radius:20px;width:min(580px,100%);padding:26px;box-shadow:0 30px 80px #0007;animation:up .18s ease}
.dlg.wide{width:min(940px,100%)}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.dlg h3{font-size:20px;margin-bottom:4px}.dlg .sub{color:var(--mut);margin:0 0 18px}
.dlg .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--gd);color:#fff;padding:13px 20px;border-radius:13px;z-index:90;box-shadow:0 14px 34px #0005;font-weight:600;max-width:92vw}
.toast.err{background:var(--red)}
.note{background:#fdf6df;border:1px solid #f1deaa;color:#7a5a00;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6}
.note.info{background:#e8f0fe;border-color:#cfdcf7;color:#27489a}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14px}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--mut)}
.seg button.on.p{background:#e1f5e6;color:#17692a}.seg button.on.a{background:#fbe3e4;color:#b01c25}.seg button.on.t{background:#fdf0cc;color:#8a6200}.seg button.on.e{background:#e3ebfb;color:#2048a6}
.todo{list-style:none;margin:0;padding:0}.todo li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #eff3f0}.todo li:last-child{border:0}
.todo li i{font-style:normal;width:30px;height:30px;border-radius:9px;background:var(--soft);display:grid;place-items:center;flex:none}
/* ----- assistant ----- */
.fab{position:fixed;right:22px;bottom:22px;z-index:40;width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,#f2b81c,#e08a0b);color:#0d3b2a;font-size:26px;cursor:pointer;box-shadow:0 12px 28px #0005}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#fff;z-index:70;box-shadow:-20px 0 60px #0004;display:flex;flex-direction:column;transform:translateX(105%);transition:.22s}
.drawer.open{transform:none}
.drawer header{background:linear-gradient(120deg,var(--gd),#14573f);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}
.drawer header h4{font-size:16px}.drawer header small{color:#cfe5d8}
.drawer header button{margin-left:auto;background:#ffffff1c;border:0;color:#fff;width:34px;height:34px;border-radius:10px;cursor:pointer}
.chat{flex:1;overflow:auto;padding:18px;background:#f6f9f6;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:12px 14px;border-radius:15px;line-height:1.55;font-size:14px}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.msg.me{background:var(--g);color:#fff;align-self:flex-end;border-top-right-radius:4px}
.msg ul{margin:6px 0 0;padding-left:18px}.msg a{color:var(--g);font-weight:700;cursor:pointer}
.sugs{display:flex;gap:7px;flex-wrap:wrap;padding:10px 16px 0;background:#f6f9f6}
.sugs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:600}
.ask{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
.ask input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
/* ----- reçu 80 mm ----- */
.rwrap{background:#e9eeea;border-radius:14px;padding:20px;display:flex;justify-content:center}
.rcpt{width:80mm;background:#fff;color:#000;font:12px/1.35 'Courier New',monospace;padding:5mm 4mm;box-shadow:0 8px 24px #0003}
.rcpt .c{text-align:center}.rcpt img.lg{width:20mm;height:20mm;display:block;margin:0 auto 2mm}
.rcpt .rh{font:bold 15px 'Courier New',monospace;text-align:center}.rcpt .rs{text-align:center;font-size:10.5px}
.rcpt hr{border:0;border-top:1px dashed #000;margin:2.5mm 0}
.rcpt .rn{text-align:center;font-weight:bold;font-size:13px;margin:1mm 0}
.rcpt .row{display:flex;justify-content:space-between;gap:6px;margin:1mm 0}.rcpt .row span:first-child{flex:none}.rcpt .row span:last-child{text-align:right;font-weight:bold}
.rcpt .big{font:bold 17px 'Courier New',monospace;text-align:center;margin:2mm 0}
.rcpt .rq{display:flex;justify-content:center;margin:3mm 0 1mm}
.rcpt .stamp{border:1px dashed #000;height:18mm;text-align:center;font-size:10px;padding-top:1mm;margin-top:2mm}
.rcpt .ft{text-align:center;font-size:10.5px;margin-top:2mm}
.a4{width:210mm;min-height:297mm;background:#fff;color:#000;padding:14mm;font:13px/1.4 'DM Sans',sans-serif}
.a4 table{font-size:12px}.a4 th,.a4 td{border:1px solid #999;padding:6px 8px}
#printzone{display:none}
@media print{
  body.printing .app,body.printing .mask,body.printing .fab,body.printing .drawer,body.printing .toast,body.printing .top{display:none!important}
  body.printing #printzone{display:block}
  body.printing{background:#fff}
  .rcpt{box-shadow:none}
}
/* ----- démo ----- */
.boot{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(900px 500px at 15% 0,#2e9a42 0%,transparent 55%),linear-gradient(160deg,#0d3b2a,#082a1f)}
.boot .box{width:min(820px,100%);text-align:center;color:#fff}
.boot img{width:120px;height:120px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #f2b81c90,0 18px 40px #0007}
.boot h1{font-size:34px;margin:20px 0 6px}.boot p{color:#cfe5d8;margin:0 0 28px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.roles button{background:#ffffff12;border:1px solid #ffffff26;border-radius:18px;padding:22px 14px;color:#fff;cursor:pointer;transition:.15s;text-align:center}
.roles button:hover{background:#ffffff22;transform:translateY(-3px)}
.roles button b{display:block;font:800 16px Manrope;margin:8px 0 4px}.roles button small{color:#bcd5c7;line-height:1.5;display:block}
.roles button i{font-style:normal;font-size:28px}
.demo-bar{background:#f2b81c;color:#0d3b2a;font-weight:700;text-align:center;padding:6px;font-size:12.5px}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g21{grid-template-columns:1fr}.roles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:55;transform:translateX(-105%);transition:.2s}
  .side.open{transform:none}
  .top{display:flex}.content{padding:20px 16px 90px}
  .g2,.f{grid-template-columns:1fr}.hello{flex-direction:column;text-align:center}.hello .dt{position:static}
  .bar{grid-template-columns:100px 1fr 40px}
}
@media(max-width:560px){.g4{grid-template-columns:1fr}.roles{grid-template-columns:1fr}}
#f_full_name,#f_father_name,#f_mother_name,#f_birth_place,#f_prev_school,#f_province,#f_sector,#f_address,#sf_n{text-transform:uppercase}
</style>
</head>
<body>
<div id="boot"></div>
<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><img src="logo.png" alt=""><div><b>Merci-Dieu</b><small>Smart School</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><div class="av" id="av"></div><div><b id="meName"></b><small id="meRole"></small></div><button title="Se déconnecter" onclick="A.logout()">⏻</button></div>
  </aside>
  <div class="main">
    <div id="demobar" class="demo-bar" hidden>MODE DÉMONSTRATION · données fictives · rien n'est enregistré</div>
    <div class="top"><button onclick="A.toggleNav()">☰</button><img src="logo.png" alt="" style="width:34px;height:34px;border-radius:50%;background:#fff"><b>Merci-Dieu Smart School</b></div>
    <div class="content" id="main"></div>
  </div>
</div>
<button class="fab" id="fab" title="Assistant" onclick="A.assistant()" hidden>✦</button>
<aside class="drawer" id="drawer">
  <header><div style="font-size:24px">✦</div><div><h4>Assistant Merci-Dieu</h4><small id="asRole"></small></div><button onclick="A.assistant()">✕</button></header>
  <div class="chat" id="chat"></div>
  <div class="sugs" id="sugs"></div>
  <form class="ask" onsubmit="A.ask(event)"><input id="askIn" placeholder="Écrivez ou parlez…" autocomplete="off"><button type="button" class="btn line" id="spkBtn" title="Lecture à voix haute désactivée" onclick="A.spk()" style="padding:0 12px;font-size:18px">🔇</button><button type="button" class="btn line" id="micBtn" title="Parler à l'assistant" onclick="A.mic()" style="padding:0 14px;font-size:18px">🎤</button><button class="btn pri">Envoyer</button></form>
</aside>
<div id="modal"></div>
<div id="printzone"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* =====================================================================
   MERCI-DIEU SMART SCHOOL — application principale
   Les droits réels sont appliqués par le serveur (schema.sql).
   Cet écran ne fait que masquer ce que le rôle ne doit pas voir.
   ===================================================================== */
const APP_VERSION='2026.10.29.3';
/* Les noms s'écrivent toujours en MAJUSCULES, dès la saisie (la base le garantit aussi). */
const UPPER_IDS=['f_full_name','f_father_name','f_mother_name','f_birth_place','f_prev_school','f_province','f_sector','f_address','sf_n'];
document.addEventListener('input',e=>{const t=e.target;if(t&&UPPER_IDS.includes(t.id)){const a=t.selectionStart,b=t.selectionEnd,u=t.value.toLocaleUpperCase('fr');if(u!==t.value){t.value=u;try{t.setSelectionRange(a,b)}catch(_){}}}});
const {SUPABASE_URL,SUPABASE_ANON}=window.MDSS;
const LIVE=!SUPABASE_URL.includes('VOTRE-PROJET');
const db=LIVE?supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fc=n=>new Intl.NumberFormat('fr-FR').format(Math.round(+n||0)).replace(/[\u202f\u00a0]/g,' ')+' FC';
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const fmtDate=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const ROLES={promoteur:'Promoteur',direction:'Directeur Général',directeur_etudes:'Directeur des Études',prefet_discipline:'Directeur de Discipline',comptable:'Comptable-secrétaire',professeur:'Professeur'};
const SEC_ZONE=s=>['Maternelle','Primaire'].includes(s)?'Primaire':(['Éducation de Base','Secondaire'].includes(s)?'Secondaire':null);
function roleLabel(p){if(!p)return'';const z=SEC_ZONE(p.section);if(p.role==='directeur_etudes')return z==='Primaire'?'Directeur (Primaire)':z==='Secondaire'?'Préfet (Secondaire)':'Directeur des Études';if(p.role==='prefet_discipline')return z?`Directeur de Discipline (${z})`:'Directeur de Discipline';return ROLES[p.role]||p.role}
const TABLES=['profiles','classes','teacher_classes','students','online_registrations','fee_rates','payments','cash_closings','staff','staff_pay','salary_advances','attendance','grades','timetable','settings','audit_log'];
const MONTHS=['Septembre','Octobre','Novembre','Décembre','Janvier','Février','Mars','Avril','Mai','Juin'];
const REASONS=[...MONTHS.map(m=>'Frais mensuel — '+m),"Frais de l'État — 1ère tranche","Frais de l'État — 2e tranche","Frais de l'État — 3e tranche",'Frais technique','Minervale','Autre'];
const A={},P={},AFTER={};
let S={},D={},Q={},SC=null;

/* ---------- outils ---------- */
const can=(...r)=>r.includes(S.role);

function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

/* nombre en lettres (français) */
function nf(n){n=Math.floor(+n||0);if(n===0)return 'zéro';
 const u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'],t=['','','vingt','trente','quarante','cinquante','soixante'];
 const b100=n=>{if(n<20)return u[n];if(n<70){const d=Math.floor(n/10),r=n%10;return t[d]+(r===1?' et un':r?'-'+u[r]:'')}if(n<80){const r=n-60;return 'soixante'+(r===11?' et onze':'-'+u[r])}const r=n-80;return 'quatre-vingt'+(r?'-'+u[r]:'s')};
 const b1000=(n,fin)=>{if(n<100)return b100(n);const c=Math.floor(n/100),r=n%100;let s=(c>1?u[c]+' ':'')+'cent';if(c>1&&r===0&&fin)s+='s';return r?s+' '+b100(r):s};
 const fix=s=>s.replace(/(cent|vingt)s$/,'$1');
 let out=[];const mi=Math.floor(n/1e6),th=Math.floor(n%1e6/1000),re=n%1000;
 if(mi)out.push(mi===1?'un million':b1000(mi,false)+' millions');
 if(th)out.push(th===1?'mille':fix(b1000(th,true))+' mille');
 if(re)out.push(b1000(re,true));
 return out.join(' ').replace(/\s+/g,' ').trim()}

function monthsElapsed(){const i=(new Date().getMonth()+4)%12;return Math.min(i,9)+1}
const rate=k=>{const r=D.fee_rates.find(x=>x.key===k);return r?+r.amount:0};
function levelKey(c){if(!c||!c.section)return null;if(c.section==='Maternelle')return 'MATERNELLE';if(c.section==='Primaire')return 'PRIMAIRE';if(c.section==='Éducation de Base')return '7_8';return /^4/.test(c.name)?'SEC_4':'SEC_1_3'}
const latePct=()=>{const v=getSetting('late_enrolment_pct');return v===undefined||v===null||v===''||isNaN(+v)?50:Math.min(100,Math.max(0,+v))};
function firstMonth(d){if(!d)return 1;const dt=new Date(d+'T12:00:00'),now=new Date(),y0=now.getMonth()>=8?now.getFullYear():now.getFullYear()-1;if(isNaN(dt)||dt<new Date(y0,8,1))return 1;return Math.min(((dt.getMonth()+4)%12)+1,10)}
function soldes(){if(SC)return SC;const n=monthsElapsed(),out=[],pct=latePct();
 for(const s of D.students){if(s.status!=='valide')continue;const c=cls(s.class_id),k=levelKey(c),monthly=k?rate('NIVEAU_'+k):0,m0=Math.min(firstMonth(s.enrolled_on),n),expected=s.social_case?0:Math.round(monthly*((n-m0+1)+(m0-1)*pct/100));
  const paid=D.payments.filter(p=>p.student_id===s.id&&p.status==='confirme'&&/^Frais mensuel/.test(p.reason)).reduce((a,p)=>a+ +p.amount,0);
  out.push({s,c,monthly,expected,paid,due:expected-paid,m0,pct})}
 return SC=out}

/* ---------- qualité des données et doublons ---------- */
function dupes(){const idx={},pairs=[],seen=new Set();const L=D.students.map(s=>({s,n:norm(s.full_name)}));
 for(const o of L)for(const t of new Set(o.n.split(' ').filter(w=>w.length>=4)))(idx[t]=idx[t]||[]).push(o);
 for(const k in idx){const g=idx[k];if(g.length>60)continue;for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){const a=g[i],b=g[j],key=a.s.id+'|'+b.s.id;if(seen.has(key))continue;seen.add(key);
  if(Math.abs(a.n.length-b.n.length)>2)continue;const d=lev(a.n,b.n);if(d<=2&&a.n.length>=8)pairs.push({a:a.s,b:b.s,d})}}
 return pairs}
function quality(){const out=[],y=new Date().getFullYear();
 for(const p of dupes())out.push({k:'Doublon possible',t:`${p.a.full_name} ↔ ${p.b.full_name}`,id:p.a.id});
 for(const s of D.students){const ph=String(s.parent_phone||'').replace(/\D/g,'');
  if(!ph||ph.length<9||/^(\d)\1+$/.test(ph))out.push({k:'Téléphone manquant ou invalide',t:s.full_name,id:s.id});
  if(!s.class_id)out.push({k:'Sans classe',t:s.full_name,id:s.id});
  if(s.birth_date){const by=+String(s.birth_date).slice(0,4);if(by<y-30||by>y-2)out.push({k:'Date de naissance improbable',t:`${s.full_name} (${fmtDate(s.birth_date)})`,id:s.id})}}
 if(can('promoteur','comptable'))for(const p of D.payments)if(+p.amount>3000000)out.push({k:'Montant très élevé',t:`${sname(p.student_id)} : ${fc(p.amount)}`,id:p.student_id});
 return out}

 if(LIVE){const {data,error}=await db.rpc('print_receipt',{p_id:id});if(error)throw error;Object.assign(p,data)}else{p.print_count=(p.print_count||0)+1;await audit(p.print_count>1?'Réimpression du reçu':'Impression du reçu',p.receipt_no,'n°'+p.print_count)}
 printHTML(receiptHTML(p),'80mm auto')}catch(e){toast(e.message,1)}};
function printHTML(html,size){const z=$('#printzone');z.innerHTML=`<style>@page{size:${size};margin:${size.startsWith('80')?'0':'8mm'}}</style>${html}`;drawQRs(z);document.body.classList.add('printing');setTimeout(()=>{window.print();setTimeout(()=>{document.body.classList.remove('printing');z.innerHTML=''},400)},250)}

P.recus=()=>{const l=paidOK().sort((a,b)=>String(b.receipt_no).localeCompare(String(a.receipt_no)));
 return head('Reçus','Tous les reçus émis. Seul le comptable-secrétaire peut les imprimer.')+`<div class="tw"><table><thead><tr><th>N° reçu</th><th>Date</th><th>Élève</th><th>Motif</th><th class="r">Montant</th><th>Impressions</th><th></th></tr></thead><tbody>${l.slice(0,300).map(p=>`<tr><td><b>${esc(p.receipt_no)}</b></td><td>${fmtDate(p.paid_on)}</td><td>${esc(sname(p.student_id))}</td><td>${esc(p.reason)}</td><td class="r">${fc(p.amount)}</td><td>${p.print_count||0}</td><td class="r"><button class="btn sm" onclick="A.receipt('${p.id}')">Voir</button></td></tr>`).join('')||`<tr><td colspan="7">${none('Aucun reçu.')}</td></tr>`}</tbody></table></div>`};

Q.so={c:'',only:true};

 `<div class="tools"><select onchange="Q.so.c=this.value;A.soList()"><option value="">Toutes les classes</option>${D.classes.map(c=>`<option value="${c.id}">${esc(clsLabel(c))}</option>`).join('')}</select><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${Q.so.only?'checked':''} onchange="Q.so.only=this.checked;A.soList()"> Seulement les élèves en retard</label></div>
 <div class="grid g3" id="sok" style="margin-bottom:16px"></div><div class="tw"><table><thead><tr><th>Élève</th><th>Classe</th><th class="r">Mensualité</th><th class="r">Attendu</th><th class="r">Payé</th><th class="r">Reste dû</th><th></th></tr></thead><tbody id="sob"></tbody></table></div>`};
AFTER.soldes=()=>A.soList();
const fSo=()=>soldes().filter(x=>(!Q.so.c||x.s.class_id===Q.so.c)&&(!Q.so.only||x.due>0)).sort((a,b)=>b.due-a.due);
A.soList=()=>{const l=fSo(),t=l.reduce((a,x)=>a+Math.max(0,x.due),0);
 $('#sok').innerHTML=kpi('Reste à percevoir',fc(t),'sur la sélection','red')+kpi('Élèves concernés',l.filter(x=>x.due>0).length,'en retard')+kpi('Taux de recouvrement',Math.round(100*l.reduce((a,x)=>a+Math.min(x.paid,x.expected),0)/Math.max(1,l.reduce((a,x)=>a+x.expected,0)))+' %','mensualités payées / attendues','gold');
 $('#sob').innerHTML=l.slice(0,300).map(x=>`<tr class="cl" onclick="A.fiche('${x.s.id}')"><td><b>${esc(x.s.full_name)}</b></td><td>${esc(clsLabel(x.c))}</td><td class="r">${fc(x.monthly)}</td><td class="r">${fc(x.expected)}</td><td class="r">${fc(x.paid)}</td><td class="r">${x.due>0?chip(fc(x.due),'bad'):chip('À jour','ok')}</td><td></td></tr>`).join('')||`<tr><td colspan="7">${none('Aucun élève.')}</td></tr>`};
A.exportSoldes=()=>csvDown('arrieres.csv',[['Élève','Classe','Mensualité','Attendu','Payé','Reste dû'],...fSo().map(x=>[x.s.full_name,clsLabel(x.c),x.monthly,x.expected,x.paid,x.due])]);

P.caisse=()=>{const t=today(),l=paidOK().filter(p=>p.paid_on===t),tot=l.reduce((a,p)=>a+ +p.amount,0),done=D.cash_closings.find(c=>c.day===t);
 return head('Clôture de caisse',"Comparez l'argent compté avec les reçus du jour.")+`<div class="grid g2"><div class="card"><h3>Aujourd'hui · ${fmtDate(t)}</h3><dl class="kv"><dt>Paiements confirmés</dt><dd>${l.length}</dd><dt>Total attendu en caisse</dt><dd style="font-size:20px">${fc(tot)}</dd></dl>
 ${done?`<div class="note info" style="margin-top:16px">Caisse déjà clôturée : compté ${fc(done.counted_total)} · écart <b>${fc(done.counted_total-done.expected_total)}</b></div>`:
 can('comptable')?`<div class="f" style="margin-top:16px"><div><label>Montant compté (FC)</label><input id="cc_a" type="number" oninput="A.ccDiff(${tot})"></div><div><label>Écart</label><input id="cc_d" disabled></div><div class="full"><label>Remarque</label><textarea id="cc_n" rows="2"></textarea></div></div><div style="margin-top:14px"><button class="btn pri" onclick="A.closeCash(${tot})">Clôturer la journée</button></div>`:'<p style="color:var(--mut)">Seul le comptable-secrétaire clôture la caisse.</p>'}</div>
 <div class="card"><h3>Historique</h3><div class="tw"><table><thead><tr><th>Jour</th><th class="r">Attendu</th><th class="r">Compté</th><th class="r">Écart</th></tr></thead><tbody>${D.cash_closings.slice().sort((a,b)=>b.day.localeCompare(a.day)).slice(0,15).map(c=>{const e=c.counted_total-c.expected_total;return `<tr><td>${fmtDate(c.day)}</td><td class="r">${fc(c.expected_total)}</td><td class="r">${fc(c.counted_total)}</td><td class="r">${e===0?chip('0','ok'):chip(fc(e),'bad')}</td></tr>`}).join('')||`<tr><td colspan="4">${none('Aucune clôture.')}</td></tr>`}</tbody></table></div></div></div>`};
A.ccDiff=t=>{const v=+val('cc_a');$('#cc_d').value=isNaN(v)?'':fc(v-t)};
A.closeCash=async t=>{const v=val('cc_a');if(v==='')return toast('Entrez le montant compté.',1);
 try{await ins('cash_closings',{day:today(),expected_total:t,counted_total:+v,note:val('cc_n'),closed_by:S.uid});await audit('Caisse clôturée',today(),'écart '+fc(+v-t));toast('Caisse clôturée ✓');render()}catch(e){toast(e.message,1)}};

const ADV={demandee:['Demandée — à signer','warn'],signee:['Signée — à verser','info'],versee:['Versée','ok'],refusee:['Refusée','bad']};
P.avances=()=>{const me=D.staff.find(s=>s.profile_id===S.uid);
 const l=D.salary_advances.slice().sort((a,b)=>String(b.requested_at).localeCompare(String(a.requested_at)));
 let h=head('Avances sur salaire','Circuit : le professeur demande → la direction signe → le comptable-secrétaire verse.',can('professeur','direction','comptable','promoteur')&&(me||can('promoteur','direction'))?`<button class="btn pri" onclick="A.advForm()">＋ ${can('professeur')?'Demander une avance':'Nouvelle avance'}</button>`:'');
 h+=`<div class="tw"><table><thead><tr><th>Date</th><th>Personnel</th><th class="r">Montant</th><th>Motif</th><th>Retenue sur</th><th>État</th><th></th></tr></thead><tbody>${l.map(a=>{const st=byId('staff',a.staff_id)||{};
  const act=(a.status==='demandee'&&can('direction'))?`<button class="btn pri sm" onclick="A.advSet('${a.id}','signee')">✍ Signer</button> <button class="btn red sm" onclick="A.advSet('${a.id}','refusee')">Refuser</button>`:(a.status==='signee'&&can('comptable'))?`<button class="btn gold sm" onclick="A.advSet('${a.id}','versee')">Verser</button>`:'';
  return `<tr><td>${fmtDate(a.requested_at)}</td><td><b>${esc(st.full_name||'—')}</b></td><td class="r">${fc(a.amount)}</td><td>${esc(a.reason||'')}</td><td>${esc(a.deduct_month||'')}</td><td>${chip(...ADV[a.status])}</td><td class="r">${act}</td></tr>`}).join('')||`<tr><td colspan="7">${none('Aucune avance.')}</td></tr>`}</tbody></table></div>`;
 if(can('direction','promoteur')){h+=`<div class="card mt"><h3>Suivi par personne</h3><div class="tw"><table><thead><tr><th>Personnel</th><th>Avances versées</th><th class="r">Total</th><th></th></tr></thead><tbody>${D.staff.map(s=>{const v=D.salary_advances.filter(a=>a.staff_id===s.id&&a.status==='versee');return `<tr><td>${esc(s.full_name)}</td><td>${v.length}</td><td class="r">${fc(v.reduce((a,x)=>a+ +x.amount,0))}</td><td>${v.length?chip('A pris une avance','warn'):chip("N'a pas pris d'avance",'ok')}</td></tr>`}).join('')}</tbody></table></div></div>`}
 return h};
A.advForm=()=>{const me=D.staff.find(s=>s.profile_id===S.uid);
 modal(`<h3>Demande d'avance sur salaire</h3><div class="f" style="margin-top:14px">${me&&can('professeur')?'':`<div class="full"><label>Bénéficiaire</label><select id="av_s">${D.staff.map(s=>`<option value="${s.id}">${esc(s.full_name)}</option>`).join('')}</select></div>`}<div><label>Montant (FC)</label><input id="av_a" type="number" min="1"></div><div><label>À retenir sur le mois de</label><select id="av_m">${MONTHS.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="full"><label>Motif</label><input id="av_r"></div></div><div class="foot"><button class="btn" onclick="A.close()">Annuler</button><button class="btn pri" onclick="A.saveAdv()">Envoyer la demande</button></div>`)};
A.saveAdv=async()=>{const me=D.staff.find(s=>s.profile_id===S.uid),sid=(me&&can('professeur'))?me.id:val('av_s'),a=+val('av_a');if(!sid||!(a>0))return toast('Montant requis.',1);
 try{await ins('salary_advances',{staff_id:sid,amount:a,reason:val('av_r'),deduct_month:val('av_m'),requested_at:new Date().toISOString()});await audit('Avance demandée',(byId('staff',sid)||{}).full_name,fc(a));A.close();toast('Demande envoyée ✓');renderNav();render()}catch(e){toast(e.message,1)}};
A.advSet=async(id,st)=>{try{const patch={status:st};if(st==='signee'){patch.signed_by=S.uid;patch.signed_at=new Date().toISOString()}if(st==='versee'){patch.paid_by=S.uid;patch.paid_at=new Date().toISOString()}
 await upd('salary_advances',id,patch);await audit('Avance '+ADV[st][0].split(' ')[0].toLowerCase(),'',fc(byId('salary_advances',id).amount));toast('Mis à jour ✓');renderNav();render()}catch(e){toast(e.message,1)}};

 <div class="tw"><table><thead><tr><th>Personnel</th><th>Fonction</th><th class="r">Salaire de base</th><th class="r">Avances à retenir</th><th class="r">Net à payer</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.s.full_name)}</b></td><td>${esc(r.s.function)}</td><td class="r">${fc(r.b)}</td><td class="r">${r.ded?chip('− '+fc(r.ded),'warn'):'—'}</td><td class="r"><b>${fc(r.net)}</b></td><td class="r"><button class="btn sm" onclick="A.baseForm('${r.s.id}')">Modifier la base</button></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4" class="r"><b>Total à payer</b></td><td class="r"><b>${fc(rows.reduce((a,r)=>a+r.net,0))}</b></td><td></td></tr></tfoot></table></div>`};
A.baseForm=id=>{const v=(D.staff_pay.find(x=>x.staff_id===id)||{}).base_salary||0;const n=prompt('Salaire de base de '+byId('staff',id).full_name+' (FC) :',v);if(n===null)return;const x=+n;if(isNaN(x)||x<0)return toast('Montant invalide.',1);

A.assign=cid=>{const ts=D.profiles.filter(p=>p.role==='professeur'),cur=D.teacher_classes.filter(x=>x.class_id===cid).map(x=>x.teacher_id);

A.saveAssign=async cid=>{const now=[...document.querySelectorAll('.as:checked')].map(x=>x.value),cur=D.teacher_classes.filter(x=>x.class_id===cid).map(x=>x.teacher_id);
 try{for(const t of cur.filter(x=>!now.includes(x)))await delRow('teacher_classes',{teacher_id:t,class_id:cid});for(const t of now.filter(x=>!cur.includes(x))){if(LIVE){const {error}=await db.from('teacher_classes').insert({teacher_id:t,class_id:cid});if(error)throw error}D.teacher_classes.push({teacher_id:t,class_id:cid})}

Q.pr={c:'',d:today(),st:{}};

 else if(t==='maj'){b.innerHTML=`<div class="card" style="max-width:520px"><h3>Mises à jour de l'application</h3><p style="color:var(--mut)">Version installée : <b>${APP_VERSION}</b></p><div id="majr" style="margin:14px 0"></div><button class="btn pri" onclick="A.checkUpdate()">🔄 Vérifier les mises à jour</button></div>`}

const SUG={promoteur:['Y a-t-il des doublons ?','Qui a des arriérés ?','Contrôler les données'],direction:['Y a-t-il des doublons ?','Avances à signer','Contrôler les données'],directeur_etudes:['Y a-t-il des doublons ?','Contrôler les données'],prefet_discipline:['Qui est absent aujourd\'hui ?','Contrôler les données'],comptable:['Qui a des arriérés ?','Y a-t-il des doublons ?','Contrôler les données'],professeur:['Mes classes','Qui est absent aujourd\'hui ?']};
function findStudents(q){const qt=norm(q).split(' ').filter(w=>w.length>1);if(!qt.length)return[];
 return D.students.map(s=>{const st=norm(s.full_name).split(' ');let sc=0;for(const t of qt){let b=0;for(const w of st){if(w===t)b=Math.max(b,2);else if(w.startsWith(t)&&t.length>=3)b=Math.max(b,1.5);else if(t.length>=4&&lev(w,t)<=1)b=Math.max(b,1.2);else if(t.length>=6&&lev(w,t)<=2)b=Math.max(b,.8)}sc+=b}return {s,sc:sc/qt.length}}).filter(x=>x.sc>=.8).sort((a,b)=>b.sc-a.sc).slice(0,6).map(x=>x.s)}
function speak(html){try{const ss=window.speechSynthesis;if(!ss)return;ss.cancel();const d=document.createElement('div');d.innerHTML=html;d.querySelectorAll('.foot,button').forEach(x=>x.remove());d.querySelectorAll('li').forEach(x=>x.append('. '));
 let t=(d.textContent||'').replace(/→/g,' devient ').replace(/\s+/g,' ').trim();if(!t)return;if(t.length>420)t=t.slice(0,420).replace(/\s+\S*$/,'')+'… Le reste est affiché à l\'écran.';
 const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.95;const v=ss.getVoices().find(x=>/^fr/i.test(x.lang));if(v)u.voice=v;ss.speak(u)}catch(e){}}
function say(t,me){const c=$('#chat');const d=document.createElement('div');d.className='msg '+(me?'me':'bot');d.innerHTML=t;c.appendChild(d);c.scrollTop=c.scrollHeight;
 if(!me&&(window.__viaVoice||window.__spk)){window.__viaVoice=false;speak(t)}}
A.spk=()=>{window.__spk=!window.__spk;try{localStorage.setItem('md_spk',window.__spk?'1':'0')}catch(e){}if(!window.__spk&&window.speechSynthesis)speechSynthesis.cancel();const b=$('#spkBtn');if(b){b.textContent=window.__spk?'🔊':'🔇';b.title=window.__spk?'Lecture à voix haute activée':'Lecture à voix haute désactivée'}
 if(window.__spk)say("Je lirai mes réponses à voix haute.")};
/* ---------- assistant : corrections par la parole (promoteur / comptable) ---------- */
const RATE_WORDS=[[/maternelle/,'MATERNELLE'],[/primaire/,'PRIMAIRE'],[/(7\s*(e|è|ème|eme)?\s*(et|\/|-|,)?\s*8)|7\s*(e|è|ème|eme)|8\s*(e|è|ème|eme)|[ée]ducation de base/,'7_8'],[/(humanit[ée]s?|secondaire).*4|4\s*(e|è|ème|eme).*(humanit|secondaire)|^.*\b4\s*(e|è|ème|eme)\b/,'SEC_4'],[/humanit|secondaire/,'SEC_1_3']];
function parseAmount(t){const m=String(t).toLowerCase().replace(/fc|cdf|francs?( congolais)?/g,'').match(/(\d[\d\s.,']*)\s*(k|mille)?/);if(!m)return null;let v=+m[1].replace(/[\s.,']/g,'');if(isNaN(v))return null;if(m[2])v*=1000;return v}
function findStudentsExact(name){const n=norm(name);if(!n)return[];let h=D.students.filter(s=>norm(s.full_name)===n);if(h.length)return h;const toks=n.split(' ').filter(w=>w.length>=2);h=D.students.filter(s=>{const sn=norm(s.full_name);return toks.length&&toks.every(t=>sn.includes(t))});if(h.length)return h.slice(0,6);return D.students.filter(s=>lev(norm(s.full_name),n)<=2).slice(0,6)}
window.__pend=null;
function editCmd(q){
 const raw=q.trim().replace(/[.!]+$/,'');const low=raw.toLowerCase();
 if(!/(modifi|corrig|chang|remplac|trompé|trompe|erreur|mets|met )/.test(low))return null;
 /* tarifs */
 if(/tarif|mensualit|frais|montant|c['’]est\s+\d|\d\s*(fc|cdf|francs|000)/.test(low)&&RATE_WORDS.some(([re])=>re.test(low))&&!/\bnom\b|t[ée]l[ée]phone|num[ée]ro/.test(low)){
  if(!can('promoteur'))return "Seul le promoteur peut modifier les tarifs.";
  const am=parseAmount(low.replace(/.*(?:c['’]est|à|en|=|:)\s*(?=\d)/,''))??parseAmount(low);const hit=RATE_WORDS.find(([re])=>re.test(low));
  if(am===null||!hit)return "Je n'ai pas compris le tarif. Exemple : « Modifie le tarif de la maternelle à 31 000 ».";
  const r=D.fee_rates.find(x=>x.key==='NIVEAU_'+hit[1]);if(!r)return "Tarif introuvable.";
  window.__pend={t:'rate',key:r.key,v:am,exp:Date.now()+300000};
  return `Je vais changer <b>${esc(r.label)}</b> : <s>${fc(r.amount)}</s> → <b>${fc(am)}</b> par mois.<div class="foot" style="margin-top:8px"><button class="btn sm pri" onclick="A.doEdit()">Confirmer</button> <button class="btn sm" onclick="A.noEdit()">Annuler</button></div>`}
 /* élèves : nom ou téléphone */
 const ph=/t[ée]l[ée]phone|num[ée]ro|whatsapp/.test(low);
 let old=null,nv=null,m;
 const R1=/(?:nom|t[ée]l[ée]phone|num[ée]ro)\s+(?:de|d['’]|du)\s*(.+?)\s*[,;:]?\s*(?:ce n['’]est pas|n['’]est pas|c['’]est pas)\s+.+?[,;:]?\s*c['’]est\s+(.+)$/i,
  R2=/(?:nom|t[ée]l[ée]phone|num[ée]ro)\s+(?:de|d['’]|du)\s*(.+?)\s+(?:en|par|:|->|→|=)\s*(.+)$/i,
  R3=/(?:nom|t[ée]l[ée]phone|num[ée]ro)\s+(?:de|d['’]|du)\s*(.+?)\s*,\s*c['’]est\s+(.+)$/i;
 for(const R of [R1,R2,R3]){m=raw.match(R);if(m){old=m[1];nv=m[2];break}}
 if(!old||!nv)return null;
 if(!can('promoteur','comptable'))return "Seuls le promoteur et le comptable-secrétaire peuvent modifier les fiches des élèves.";
 old=old.replace(/^["«“]|["»”]$/g,'').trim();nv=nv.replace(/^["«“]|["»”]$/g,'').trim();
 const hits=findStudentsExact(old);
 if(!hits.length)return `Je ne trouve aucun élève nommé « ${esc(old)} ». Vérifiez l'orthographe.`;
 if(hits.length>1)return `Plusieurs élèves correspondent à « ${esc(old)} » :<ul>${hits.map(s=>`<li><a onclick="A.fiche('${s.id}')">${esc(s.full_name)}</a> — ${esc(clsLabel(cls(s.class_id)))}</li>`).join('')}</ul>Écrivez le nom complet exact pour que je sache lequel modifier.`;
 const s=hits[0];
 if(ph){const n=phoneIntl(nv);if(n.length<11||n.length>13)return "Ce numéro ne semble pas valable. Exemple : 0976 009 343.";
  window.__pend={t:'stu',id:s.id,f:'parent_phone',v:nv.replace(/\s+/g,''),exp:Date.now()+300000};
  return `Je vais changer le téléphone du parent de <b>${esc(s.full_name)}</b> : <s>${esc(s.parent_phone||'—')}</s> → <b>${esc(nv.replace(/\s+/g,''))}</b>.<div class="foot" style="margin-top:8px"><button class="btn sm pri" onclick="A.doEdit()">Confirmer</button> <button class="btn sm" onclick="A.noEdit()">Annuler</button></div>`}
 const up=nv.toLocaleUpperCase('fr');
 window.__pend={t:'stu',id:s.id,f:'full_name',v:up,exp:Date.now()+300000};
 return `Je vais corriger le nom de l'élève : <s>${esc(s.full_name)}</s> → <b>${esc(up)}</b> (${esc(clsLabel(cls(s.class_id)))}).<div class="foot" style="margin-top:8px"><button class="btn sm pri" onclick="A.doEdit()">Confirmer</button> <button class="btn sm" onclick="A.noEdit()">Annuler</button></div>`}

A.mic=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition,b=$('#micBtn');
 if(!SR)return say("La commande vocale n'est pas disponible sur ce navigateur. Utilisez Chrome sur Android ou sur ordinateur, ou le micro du clavier de votre téléphone.");
 if(window.__rec){try{window.__rec.stop()}catch(e){}return}
 if(window.speechSynthesis)speechSynthesis.cancel();
 const r=new SR();r.lang='fr-FR';r.interimResults=true;r.maxAlternatives=1;window.__rec=r;let fin='';
 r.onstart=()=>{b.textContent='⏹';b.style.background='#fde8e4';$('#askIn').placeholder='Je vous écoute…'};
 r.onresult=e=>{let t='';for(const x of e.results){t+=x[0].transcript;if(x.isFinal)fin=t}$('#askIn').value=t};
 r.onerror=e=>{say(e.error==='not-allowed'||e.error==='service-not-allowed'?"Le micro est refusé. Autorisez-le dans les réglages du site, puis réessayez.":e.error==='no-speech'?"Je n'ai rien entendu. Réessayez.":"La commande vocale a échoué ("+esc(e.error)+"). Vérifiez la connexion internet.")};
 r.onend=()=>{window.__rec=null;if(window.speechSynthesis)speechSynthesis.cancel();b.textContent='🎤';b.style.background='';$('#askIn').placeholder='Écrivez ou parlez…';const t=$('#askIn').value.trim();if(t){window.__viaVoice=true;A.ask(null,t)}};
 try{r.start()}catch(e){window.__rec=null}};

A.doEdit=async()=>{const p=window.__pend;if(!p||p.exp<Date.now()){window.__pend=null;return say("Cette demande a expiré. Écrivez-la de nouveau.")}window.__pend=null;
 try{if(p.t==='rate'){if(!can('promoteur'))throw new Error('Réservé au promoteur.');const r=D.fee_rates.find(x=>x.key===p.key),old=r.amount;if(LIVE){const {error}=await db.from('fee_rates').update({amount:p.v}).eq('key',p.key);if(error)throw error}r.amount=p.v;SC=null;dirty();await audit('Tarif modifié (assistant)',r.label,fc(old)+' → '+fc(p.v));say(`C'est fait : <b>${esc(r.label)}</b> = <b>${fc(p.v)}</b> par mois.`)}
  else{if(!can('promoteur','comptable'))throw new Error('Non autorisé.');const s=stu(p.id),old=s[p.f];await upd('students',p.id,{[p.f]:p.v});await audit('Fiche modifiée (assistant)',s.full_name,p.f+' : '+(old||'—')+' → '+p.v);SC=null;say(`C'est fait. <a onclick="A.fiche('${p.id}')">Ouvrir la fiche</a>`);renderNav();render()}
 }catch(e){say("Je n'ai pas pu modifier : "+esc(e.message))}};

function brain(q){const n=norm(q),raw=q.toLowerCase();const ec=editCmd(q);if(ec)return ec;const stl=l=>l.length?'<ul>'+l.map(s=>`<li><a onclick="A.fiche('${s.id}')">${esc(s.full_name)}</a> — ${esc(clsLabel(cls(s.class_id)))}</li>`).join('')+'</ul>':'';
 if(/doublon/.test(raw)){const d=dupes();return d.length?`J'ai trouvé <b>${d.length}</b> doublon(s) possible(s) :<ul>${d.slice(0,8).map(p=>`<li><a onclick="A.fiche('${p.a.id}')">${esc(p.a.full_name)}</a> ↔ <a onclick="A.fiche('${p.b.id}')">${esc(p.b.full_name)}</a></li>`).join('')}</ul>Ouvrez chaque fiche pour vérifier avant de corriger.`:"Aucun doublon détecté dans les élèves que je peux voir."}
 if(/contr[oô]l|erreur|faute|v[ée]rifi|anomal/.test(raw)){const q2=quality();if(!q2.length)return "Tout semble cohérent ✓";const g={};q2.forEach(x=>(g[x.k]=g[x.k]||[]).push(x));return `<b>${q2.length}</b> point(s) à vérifier :<ul>${Object.entries(g).map(([k,v])=>`<li>${k} : <b>${v.length}</b> — ${v.slice(0,3).map(x=>`<a onclick="A.fiche('${x.id}')">${esc(x.t)}</a>`).join(', ')}${v.length>3?'…':''}</li>`).join('')}</ul>`}
 if(/arri[ée]r|impay|doit|retard de paiement|dette/.test(raw)){if(!can('promoteur','comptable'))return "Les informations de paiement ne sont pas accessibles avec votre rôle.";const l=soldes().filter(x=>x.due>0).sort((a,b)=>b.due-a.due);return l.length?`<b>${l.length}</b> élève(s) en retard, total <b>${fc(l.reduce((a,x)=>a+x.due,0))}</b>. Les plus élevés :<ul>${l.slice(0,6).map(x=>`<li><a onclick="A.fiche('${x.s.id}')">${esc(x.s.full_name)}</a> — ${fc(x.due)}</li>`).join('')}</ul>`:"Personne n'est en retard sur les mensualités ✓"}
 if(/avance/.test(raw)){const a=D.salary_advances.filter(x=>x.status==='demandee'),b=D.salary_advances.filter(x=>x.status==='signee');return `${a.length} avance(s) à signer par la direction, ${b.length} signée(s) à verser par le comptable-secrétaire.`}
 if(/absent/.test(raw)){const a=D.attendance.filter(x=>x.day===today()&&x.state==='absent');return a.length?`Absents aujourd'hui :<ul>${a.map(x=>`<li>${esc(sname(x.student_id))}</li>`).join('')}</ul>`:"Aucun absent enregistré aujourd'hui."}
 if(/combien|effectif|nombre/.test(raw)){const m={};D.students.forEach(s=>{const l=clsLabel(cls(s.class_id));m[l]=(m[l]||0)+1});return `<b>${D.students.length}</b> élèves.<ul>${Object.entries(m).map(([k,v])=>`<li>${esc(k)} : ${v}</li>`).join('')}</ul>`}
 if(/classe/.test(raw)&&can('professeur'))return 'Vos classes : '+D.classes.map(c=>esc(clsLabel(c))).join(', ');
 const f=findStudents(q.replace(/cherche|trouve|qui est|o[uù] est|fiche de|élève/gi,''));if(f.length)return `J'ai trouvé :${stl(f)}`;
 return "Je peux : <ul><li>retrouver un élève (même mal orthographié)</li><li>repérer les doublons et les erreurs de saisie</li><li>lister les arriérés, avances, absents, effectifs</li></ul>"}
A.assistant=()=>{try{if(localStorage.getItem('md_spk')==='1'&&!window.__spk){window.__spk=true;const b=$('#spkBtn');if(b){b.textContent='🔊';b.title='Lecture à voix haute activée'}}}catch(e){}const d=$('#drawer');d.classList.toggle('open');if(d.classList.contains('open')){$('#asRole').textContent=ROLES[S.role];if(!$('#chat').children.length)say(`Bonjour ${esc((S.name||'').split(' ')[0])}. Je suis votre assistant : je vous aide à éviter les erreurs et les doublons, et à retrouver un nom rapidement. Je ne vois que ce que votre rôle permet.`);$('#sugs').innerHTML=(SUG[S.role]||[]).map(s=>`<button onclick="A.ask(null,'${s.replace(/'/g,"\\'")}')">${s}</button>`).join('');setTimeout(()=>$('#askIn').focus(),250)}};
A.ask=(e,t)=>{if(e)e.preventDefault();const q=t||val('askIn');if(!q)return;$('#askIn').value='';say(esc(q),1);setTimeout(()=>say(brain(q)),250)};

(async()=>{
 if('serviceWorker' in navigator&&LIVE)navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(LIVE){const {data}=await db.auth.getSession();if(!data.session){location.href='connexion.html';return}
  const {data:prof}=await db.from('profiles').select('*').eq('id',data.session.user.id).single();
  if(!prof||!prof.active){await db.auth.signOut();location.href='connexion.html';return}

 else bootDemo()})();

function seedDemo(){let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646},R=a=>a[Math.floor(rnd()*a.length)];
 D={_rn:0};TABLES.forEach(t=>D[t]=[]);
 D.classes=[['Maternelle 3','Maternelle','Maternelle'],['4ème Primaire','Primaire','Primaire'],['6ème Primaire','Primaire','Primaire'],['7ème EB','Éducation de Base','Éducation de Base'],['8ème EB','Éducation de Base','Éducation de Base'],['1ère Secondaire','Secondaire','Électricité'],['3ème Secondaire','Secondaire','Pédagogie Générale'],['4ème Secondaire','Secondaire','Électricité']].map((c,i)=>({id:'c'+i,name:c[0],section:c[1],option:c[2],year:'2026-2027'}));
 D.fee_rates=[['NIVEAU_MATERNELLE','Maternelle',25000],['NIVEAU_PRIMAIRE','Primaire',15000],['NIVEAU_7_8','7ème / 8ème Éducation de Base',25000],['NIVEAU_SEC_1_3','Secondaire 1ère à 3ème',25000],['NIVEAU_SEC_4','Secondaire 4ème',34000],['ETAT_MATERNELLE',"Frais de l'État - Maternelle (par tranche)",10000],['ETAT_PRIMAIRE',"Frais de l'État - Primaire (par tranche)",10000],['ETAT_7_8',"Frais de l'État - 7ème/8ème (par tranche)",17500],['ETAT_SEC_1_3',"Frais de l'État - Secondaire 1ère à 3ème (par tranche)",22500],['ETAT_SEC_4',"Frais de l'État - Secondaire 4ème (par tranche)",25000]].map(r=>({key:r[0],label:r[1],amount:r[2]}));
 const F=['Grâce','Patience','David','Esther','Joël','Divine','Samuel','Merveille','Prince','Rachel','Jonathan','Déborah','Emmanuel','Sarah','Glody','Ruth','Christian','Nadège','Fabrice','Chancelle'],L=['Kabamba','Mwamba','Ilunga','Kalenga','Mutombo','Banza','Tshibangu','Kasongo','Mukendi','Numbi','Kapend','Lubaba','Ngoy','Kyungu','Mpoyo'],Po=['Mbuyi','Tshala','Kazadi','Nkulu','Mulumba'];
 const now=new Date(),y0=now.getMonth()>=8?now.getFullYear():now.getFullYear()-1,n=monthsElapsed();let k=0;
 D.classes.forEach((c,ci)=>{for(let j=0;j<6;j++){const full=`${R(L)} ${R(Po)} ${R(F)}`,age={Maternelle:5,Primaire:ci==1?9:11,'Éducation de Base':ci==3?12:13,Secondaire:ci==5?14:ci==6?16:18}[c.section];
  D.students.push({id:'s'+(++k),full_name:full,sex:rnd()>.5?'Féminin':'Masculin',birth_date:`${now.getFullYear()-age-(rnd()>.5?0:1)}-0${1+Math.floor(rnd()*9)}-1${Math.floor(rnd()*9)}`,birth_place:'Kasumbalesa',father_name:`${R(L)} ${R(Po)}`,mother_name:`${R(F)} ${R(L)}`,parent_phone:'09'+String(Math.floor(10000000+rnd()*89999999)),class_id:c.id,social_case:k===9,status:k%17===0?'a_verifier':'valide',qr_token:'tk'+k,created_at:new Date().toISOString(),address:'Kasumbalesa',prev_school:''})}});
 const d0=D.students[0];D.students.push({...d0,id:'s'+(++k),full_name:d0.full_name.replace(/a/,'aa'),status:'a_verifier',parent_phone:'0000000',qr_token:'tkdup'});
 let rc=0;const pays=[];
 D.students.filter(s=>s.status==='valide').forEach(s=>{const kk=levelKey(cls(s.class_id));const paidN=Math.floor(rnd()*(n+1));for(let i=0;i<Math.min(paidN,n);i++){if(s.social_case)continue;const m=8+i,dt=new Date(m>=12?y0+1:y0,m%12,1+Math.floor(rnd()*20));if(dt>now)continue;pays.push({id:'p'+(++rc),student_id:s.id,reason:'Frais mensuel — '+MONTHS[i],amount:rate2(kk),method:R(['Espèces','Espèces','Mobile money']),paid_on:ymd(dt),status:'confirme',receipt_no:'MD-REC-'+String(++D._rn).padStart(6,'0'),print_count:rnd()>.4?1:0,qr_token:'pq'+rc,confirmed_by:'p-comp',created_at:dt.toISOString()})}});
 function rate2(k){return {MATERNELLE:25000,PRIMAIRE:15000,'7_8':25000,SEC_1_3:25000,SEC_4:34000}[k]||15000}
 D.students.filter(s=>s.status==='valide').slice(0,4).forEach(s=>{pays.push({id:'p'+(++rc),student_id:s.id,reason:'Frais mensuel — '+MONTHS[Math.min(n,10)-1],amount:rate2(levelKey(cls(s.class_id))),method:'Espèces',paid_on:today(),status:'confirme',receipt_no:'MD-REC-'+String(++D._rn).padStart(6,'0'),print_count:0,qr_token:'pt'+rc,confirmed_by:'p-comp',created_at:new Date().toISOString()})});
 D.payments=pays;
 D.profiles=[['p-promo','Promoteur Démo','promoteur'],['p-dir','Directeur Général Démo','direction'],['p-etudes','Directeur des Études Démo','directeur_etudes'],['p-prefet','Préfet de Discipline Démo','prefet_discipline'],['p-comp','Caissière Démo','comptable'],['p-prof','Professeur Démo','professeur'],['p-prof2','Autre Professeur','professeur']].map(p=>({id:p[0],full_name:p[1],role:p[2],active:true}));
 D.staff=[['Directeur Général Démo','Directeur Général','Direction','p-dir'],['Directeur des Études Démo','Directeur des études','Direction','p-etudes'],['Préfet de Discipline Démo','Préfet de discipline','Direction','p-prefet'],['Caissière Démo','Comptable-secrétaire','Administration','p-comp'],['Professeur Démo','Enseignant Secondaire','Secondaire','p-prof'],['Autre Professeur','Enseignant Primaire','Primaire','p-prof2'],['Mukendi Grâce','Enseignant Primaire','Primaire',null],['Ilunga Joël','Enseignant Secondaire','Secondaire',null]].map((s,i)=>({id:'st'+i,full_name:s[0],function:s[1],section:s[2],profile_id:s[3],phone:'0997'+String(100000+i*7919)}));
 D.staff_pay=D.staff.map(s=>({id:'sp'+s.id,staff_id:s.id,base_salary:150000+Math.floor(rnd()*250000/5000)*5000}));
 D.salary_advances=[{id:'a1',staff_id:'st2',amount:50000,reason:'Frais médicaux',deduct_month:MONTHS[Math.min(n,10)-1],status:'demandee',requested_at:new Date().toISOString()},{id:'a2',staff_id:'st4',amount:80000,reason:'Rentrée scolaire',deduct_month:MONTHS[Math.min(n,10)-1],status:'signee',requested_at:new Date(Date.now()-86400000*2).toISOString()},{id:'a3',staff_id:'st5',amount:40000,reason:'Transport',deduct_month:MONTHS[Math.min(n,10)-1],status:'versee',requested_at:new Date(Date.now()-86400000*9).toISOString()}];
 D.teacher_classes=[{teacher_id:'p-prof',class_id:'c5'},{teacher_id:'p-prof',class_id:'c6'},{teacher_id:'p-prof2',class_id:'c1'}];
 const yd=ymd(new Date(Date.now()-86400000));D.students.filter(s=>s.status==='valide').forEach((s,i)=>{D.attendance.push({id:'at'+i,student_id:s.id,class_id:s.class_id,day:yd,state:i%11===0?'absent':'present'})});
 D.students.filter(s=>s.status==='valide').forEach((s,i)=>['Mathématiques','Français','Sciences'].forEach((m,j)=>D.grades.push({id:'g'+i+j,student_id:s.id,class_id:s.class_id,period:'1er trimestre',subject:m,score:Math.round((6+rnd()*13)*2)/2,max_score:20})));
 D.timetable=[['c5','Lundi','07:30','08:20','Électricité'],['c5','Lundi','08:20','09:10','Mathématiques'],['c5','Mardi','07:30','08:20','Français'],['c6','Mercredi','07:30','08:20','Pédagogie']].map((t,i)=>({id:'t'+i,class_id:t[0],teacher_id:'p-prof',day:t[1],start_time:t[2],end_time:t[3],subject:t[4]}));
 D.online_registrations=[['Kalenga Mwamba Esther','F','4ème Primaire'],['Banza Nkulu David','M','1ère Secondaire'],['Mutombo Tshala Ruth','F','Maternelle 3']].map((r,i)=>({id:'o'+i,received_at:new Date(Date.now()-86400000*i).toISOString(),processed:false,payload:{full_name:r[0],sex:r[1]==='F'?'Féminin':'Masculin',class_label:r[2],parent_phone:'0998'+(100000+i*4321),father_name:'Parent '+(i+1)}}));
 D.cash_closings=[{id:'cc1',day:yd,expected_total:230000,counted_total:230000,closed_by:'p-comp'}];
 D.settings=[{key:'receipt_template',value:{...DEFTPL}}];
 D.audit_log=[{id:'l1',at:new Date().toISOString(),user_id:'p-comp',action:'Paiement confirmé',ref:'MD-REC-000001',detail:'démonstration'}]}
function demoRestrict(){const r=S.role;
 if(r==='direction'){['payments','cash_closings','fee_rates','online_registrations','audit_log'].forEach(t=>D[t]=[])}
 if(r==='directeur_etudes'){['payments','cash_closings','fee_rates','online_registrations','audit_log','staff_pay'].forEach(t=>D[t]=[])}
 if(r==='prefet_discipline'){['payments','cash_closings','fee_rates','online_registrations','audit_log','staff_pay','grades'].forEach(t=>D[t]=[])}
 if(r==='comptable'){['attendance','grades','timetable','staff_pay','audit_log'].forEach(t=>D[t]=[])}
 if(r==='professeur'){const mine=D.teacher_classes.filter(x=>x.teacher_id===S.uid).map(x=>x.class_id);
  D.classes=D.classes.filter(c=>mine.includes(c.id));D.students=D.students.filter(s=>mine.includes(s.class_id));
  ['payments','cash_closings','fee_rates','online_registrations','audit_log','staff_pay'].forEach(t=>D[t]=[]);
  D.attendance=D.attendance.filter(a=>mine.includes(a.class_id));D.grades=D.grades.filter(g=>mine.includes(g.class_id));D.timetable=D.timetable.filter(t=>mine.includes(t.class_id)||t.teacher_id===S.uid);
  const me=D.staff.filter(s=>s.profile_id===S.uid).map(s=>s.id);D.staff=D.staff.filter(s=>me.includes(s.id));D.salary_advances=D.salary_advances.filter(a=>me.includes(a.staff_id));D.profiles=D.profiles.filter(p=>p.id===S.uid);D.teacher_classes=D.teacher_classes.filter(x=>x.teacher_id===S.uid)}}
